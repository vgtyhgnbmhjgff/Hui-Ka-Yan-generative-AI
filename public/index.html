<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>许家印大模型</title>
<style>
  :root {
    --ink: #202124;
    --muted: #5f6368;
    --accent: #1a73e8;
    --line: #dadce0;
    --bg-soft: #f8f9fa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main { max-width: 680px; width: 100%; text-align: center; }
  h1 {
    font-size: 2.6rem;
    font-weight: 500;
    margin: 0 0 12px;
    letter-spacing: 2px;
  }
  .sub {
    color: var(--muted);
    font-size: 1.02rem;
    line-height: 1.7;
    margin: 0 0 40px;
  }
  .sub strong { color: var(--ink); font-weight: 500; }
  .card {
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px 28px;
    text-align: left;
  }
  .field { margin: 0 0 26px; }
  .field:last-child { margin-bottom: 0; }
  .label {
    font-size: .74rem;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    color: var(--muted);
    margin: 0 0 8px;
  }
  .value { font-size: 1.05rem; word-break: break-all; }
  .code {
    display: inline-block;
    font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 5px 12px;
    font-size: .95rem;
    word-break: break-all;
  }
  .desc { font-size: .86rem; color: var(--muted); margin-top: 8px; }
  .accent { color: var(--accent); }
  .note {
    margin: 28px 0 0;
    font-size: .9rem;
    color: var(--muted);
  }
  .fade { opacity: 0; transform: translateY(10px); animation: fadeIn .7s ease forwards; }
  .d1 { animation-delay: .06s; }
  .d2 { animation-delay: .2s; }
  .d3 { animation-delay: .34s; }
  .d4 { animation-delay: .5s; }
  @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) {
    .fade { opacity: 1; transform: none; animation: none; }
  }
</style>
</head>
<body>
<main>
  <h1 class="fade d1">许家印大模型</h1>
  <p class="sub fade d2">
    我们有全球领先的大模型 API。<strong>并发数 100000000000</strong>，token 无限、无需 API Key。
  </p>

  <div class="card fade d3">
    <div class="field">
      <div class="label">Base URL</div>
      <div class="value"><span class="code" id="baseUrl">https://你的域名/v1</span></div>
    </div>
    <div class="field">
      <div class="label">模型名</div>
      <div class="value">许家印大模型 · 许家印图片生成</div>
    </div>
    <div class="field">
      <div class="label">鉴权</div>
      <div class="value"><span class="code">sk-wuchuangtianjiaquanyufangxiashouzhongsha</span></div>
      <div class="desc">填写此 CDK 能发挥出大模型的全部实力</div>
    </div>
  </div>

  <p class="note fade d4">兼容 OpenAI 协议。任何 OpenAI 客户端填上这个 Base URL 就能用。</p>
</main>
<script>
  document.getElementById("baseUrl").textContent = location.origin + "/v1";
</script>
</body>
</html>
